<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="description" content="智选车计划部数据平台，查看销售需求、制定未来入库计划，统一访问 SOP 计划看板与订单分析。">
  <meta name="theme-color" content="#329AF0">
  <title>智选车计划部数据平台</title>
  <link rel="icon" href="./assets/favicon.ico?v=open-p-20261104" sizes="any">
  <link rel="icon" href="./assets/planning-icon.svg?v=open-p-20261104" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=open-p-20261104">
  <link rel="stylesheet" href="./css/portal.css?v=cycle-demo-20261105">
  <script type="module" src="./js/portal.js?v=cycle-demo-20261105"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到工作区</a>
  <div class="shell">
    <header class="site-header">
      <div class="header-main page-width">
        <a class="brand" href="#/home">
          <img class="brand-mark" src="./assets/planning-icon.svg?v=open-p-20261104" width="42" height="42" alt="" aria-hidden="true">
          <span class="brand-copy"><span id="brand-organization" class="brand-organization">智选车</span><strong id="brand-name">计划部数据平台</strong></span>
        </a>
          <div id="primary-navigation" class="primary-navigation">
            <a class="nav-item home-link" href="#/home" id="home-link"><span data-icon="grid"></span><span>工作台</span></a>
            <nav id="app-nav" aria-label="业务应用"></nav>
          </div>
        <div class="header-tools">
          <span id="current-location" class="sr-only">工作台</span>
          <div class="identity"><span class="avatar" data-icon="user"></span><span><strong id="identity-name">计划部工作空间</strong><small id="identity-detail">销售与运作计划</small></span></div>
          <button id="nav-toggle" class="nav-toggle" aria-label="展开应用导航" aria-expanded="false" aria-controls="primary-navigation"><span data-icon="menu"></span><span>应用</span></button>
        </div>
      </div>

    </header>

    <main id="main" tabindex="-1">
      <div id="boot-state" class="empty-state" role="status"><span class="spinner"></span><h1>正在准备工作空间</h1><p>加载应用配置…</p></div>
      <section id="home-view" class="home-view page-width" hidden aria-labelledby="home-title">
        <div class="home-heading">
          <div><h1 id="home-title">本轮计划工作</h1><p class="home-context">围绕需求变化，制定未来各期入库计划</p></div>
          <div class="home-heading-meta"><span class="demo-badge">DEMO · 计划周期</span><time id="today"></time></div>
        </div>
        <div class="cycle-demo-notice"><p id="cycle-demo-note">阶段、清单和计划窗口为演示，刷新后重置；下方应用入口按实际接入状态开放。</p><button id="cycle-reset" class="secondary-button" type="button">重置演示</button></div>
        <ol id="cycle-stages" class="cycle-stages" aria-label="演示计划阶段"></ol>
        <div class="cycle-layout">
          <section class="cycle-panel cycle-tasks" aria-labelledby="cycle-tasks-title">
            <div class="cycle-panel-heading"><div><h2 id="cycle-tasks-title">本轮工作清单</h2><span id="cycle-focus"></span></div><span id="cycle-task-summary" role="status" aria-atomic="true"></span></div>
            <div id="cycle-tasks"></div>
          </section>
          <aside class="cycle-aside">
            <section class="cycle-panel" aria-labelledby="cycle-windows-title"><div class="cycle-panel-heading"><h2 id="cycle-windows-title">关注的计划窗口</h2><span>演示窗口</span></div><div id="cycle-windows"></div></section>
            <section class="cycle-panel" aria-labelledby="cycle-records-title"><div class="cycle-panel-heading"><h2 id="cycle-records-title">本轮记录</h2><span>演示占位</span></div><div id="cycle-records" class="cycle-record-links"></div><div id="cycle-record-detail" class="cycle-record-detail" role="status" aria-atomic="true" hidden></div></section>
          </aside>
        </div>
        <section class="cycle-apps" aria-labelledby="home-apps-title"><h2 id="home-apps-title">应用入口</h2><div id="home-apps" class="cycle-app-links"></div></section>
      </section>

      <section id="app-view" class="app-view" hidden aria-labelledby="app-title">
        <h1 id="app-title" class="sr-only"></h1>
        <div class="frame-container" id="frame-container"><div id="frame-overlay" class="frame-overlay" role="status"><span id="frame-spinner" class="spinner"></span><h2 id="frame-message"></h2><p id="frame-detail"></p><button id="retry-app" class="secondary-button" hidden><span data-icon="refresh"></span>重新加载</button></div></div>
      </section>
    </main>
  </div>
  <noscript><div class="noscript">请启用 JavaScript 以使用业务应用导航。</div></noscript>
</body>
</html>
