<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="description" content="智选车计划部工作台，统一访问部门业务应用。">
  <meta name="theme-color" content="#f4f6f9">
  <title>智选车计划部工作台</title>
  <link rel="icon" href="./assets/favicon.ico?v=clear-p-20261119" sizes="any">
  <link rel="icon" href="./assets/favicon.svg?v=clear-p-20261119" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=clear-p-20261119">
  <link rel="stylesheet" href="./css/portal.css?v=app-directory-1">
  <script src="./js/frame-account.js?v=parent-origin-2"></script>
  <script type="module" src="./js/portal.js?v=app-directory-1"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到工作区</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-heading">
        <a class="brand" href="#/home" aria-label="智选车计划部工作台" title="智选车计划部工作台">
          <img class="brand-mark" src="./assets/planning-icon.svg?v=clear-p-20261119" width="36" height="36" alt="">
          <span class="brand-copy"><span id="brand-organization" class="brand-organization">智选车</span><strong id="brand-name">计划部工作台</strong></span>
        </a>
      </div>
      <nav id="primary-navigation" class="primary-navigation" aria-label="工作台导航">
        <a class="nav-item home-link" href="#/home" id="home-link" aria-label="工作台" title="工作台"><span data-icon="grid"></span><span class="nav-label">工作台</span></a>
        <div id="app-nav"></div>
      </nav>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-label="展开应用导航" title="展开应用导航" aria-expanded="false" aria-controls="primary-navigation"><span data-icon="panel"></span><span class="nav-label" aria-hidden="true">收起导航</span></button>
    </aside>

    <main id="main" tabindex="-1">
      <div id="boot-state" class="empty-state" role="status"><span class="spinner"></span><h1>正在准备工作空间</h1><p>加载应用配置…</p></div>
      <section id="home-view" class="home-view page-width" hidden aria-labelledby="home-title">
        <h1 id="home-title">智选车计划部工作台</h1>
        <ul id="home-apps" class="app-directory" aria-label="业务应用"></ul>
      </section>

      <section id="app-view" class="app-view" hidden aria-labelledby="app-title">
        <h1 id="app-title" class="sr-only"></h1>
        <div class="frame-container" id="frame-container"><div id="frame-overlay" class="frame-overlay" role="status"><span id="frame-spinner" class="spinner"></span><h2 id="frame-message"></h2><p id="frame-detail"></p><button id="retry-app" class="secondary-button" hidden><span data-icon="refresh"></span>重新加载</button></div></div>
      </section>
    </main>
  </div>
  <noscript><div class="noscript">请启用 JavaScript 以使用业务应用导航。</div></noscript>
</body>
</html>
