  <polyline points="24,12 24,21" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="40,12 40,21" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="15,28 49,28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="21" y="34" width="5.5" height="5.5" rx="1.5" fill="#FFFFFF"/>
  <rect x="21" y="43" width="5.5" height="5.5" rx="1.5" fill="#FFFFFF"/>
  <polyline points="32,45 43,34" fill="none" stroke="#67E8D3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="34,34 43,34 43,43" fill="none" stroke="#67E8D3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
